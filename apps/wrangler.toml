# Worker configuration for carrymybottle.
# Secrets (ADMIN_PASSWORD_HASH, ADMIN_PASSWORD_SALT, SESSION_SECRET,
# RESEND_API_KEY, VOTE_TOKEN_SECRET) are registered via `wrangler secret`
# and must NOT be committed here.
# For local development, copy .dev.vars.example to .dev.vars.

name = "carrymybottle"
main = ".open-next/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "09381b15a7d3beb91294a7ce295420a4"

assets = { directory = ".open-next/assets", binding = "ASSETS" }

[vars]
APP_ENV = "development"
APP_BASE_URL = "http://localhost:3000"
EMERGENCY_CONTACT_TO = "carry.my.bottle@gmail.com"
EMERGENCY_CONTACT_FROM = "noreply@gdgoc-osaka.jp"
# 給水機画像の公開配信ベースURL（#190）。dev は r2.dev マネージドURL（公開アクセス
# 有効化済み: wrangler r2 bucket dev-url enable）。末尾スラッシュなし。
IMAGE_PUBLIC_BASE_URL = "https://pub-03077de7c2104407a48657101cf6b2c8.r2.dev"

[[d1_databases]]
binding = "DB"
database_name = "carrymybottle-dev"
database_id = "e0af63ef-25c0-48b3-8459-9875e1d87814"

# 給水機写真用 R2 バケット（#190）。アップロード（PUT）にこのバインディングを使う。
[[r2_buckets]]
binding = "STATION_IMAGES"
bucket_name = "carrymybottle-station-images-dev"

[env.production]
[env.production.vars]
APP_ENV = "production"
# TODO: update APP_BASE_URL once the production custom domain is confirmed
APP_BASE_URL = "https://carrymybottle.gdsc-osaka.workers.dev"
EMERGENCY_CONTACT_TO = "carry.my.bottle@gmail.com"
EMERGENCY_CONTACT_FROM = "noreply@example.com"
# TODO: prod は公開バケットにカスタムドメインを接続し、その URL を設定する。
IMAGE_PUBLIC_BASE_URL = ""

[[env.production.d1_databases]]
binding = "DB"
database_name = "carrymybottle-prod"
# TODO: replace with the production D1 database_id created via Terraform
database_id = "placeholder-replace-with-actual-id"

# prod 用バケットは environments/prod 作成時に Terraform で作成する。
[[env.production.r2_buckets]]
binding = "STATION_IMAGES"
bucket_name = "carrymybottle-station-images-prod"
