# Worker configuration for carrymybottle.
# Secrets (ADMIN_PASSWORD_HASH, ADMIN_PASSWORD_SALT, SESSION_SECRET,
# RESEND_API_KEY, VOTE_TOKEN_SECRET) are registered via `wrangler secret`
# and must NOT be committed here.
# For local development, copy .dev.vars.example to .dev.vars.

name = "carrymybottle"
main = ".open-next/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
# Cloudflare account that owns the dev and prod D1 databases. Inherited by all
# environments (incl. [env.production]); not a secret. Avoids wrangler's
# account auto-detection failing in some environments (e.g. WSL).
account_id = "09381b15a7d3beb91294a7ce295420a4"

assets = { directory = ".open-next/assets", binding = "ASSETS" }

[vars]
APP_ENV = "development"
APP_BASE_URL = "http://localhost:3000"
EMERGENCY_CONTACT_TO = "carry.my.bottle@gmail.com"
EMERGENCY_CONTACT_FROM = "noreply@example.com"
# Optional rate-limit overrides (per client IP, fixed window). Defaults live in
# lib/rate-limit/config.ts: contact 5/600s, vote 20/600s, admin_login 10/600s.
# RATE_LIMIT_CONTACT_MAX = "5"
# RATE_LIMIT_CONTACT_WINDOW_SEC = "600"
# RATE_LIMIT_VOTE_MAX = "20"
# RATE_LIMIT_VOTE_WINDOW_SEC = "600"
# RATE_LIMIT_ADMIN_LOGIN_MAX = "10"
# RATE_LIMIT_ADMIN_LOGIN_WINDOW_SEC = "600"

[[d1_databases]]
binding = "DB"
database_name = "carrymybottle-dev"
database_id = "e0af63ef-25c0-48b3-8459-9875e1d87814"

[env.production]
[env.production.vars]
APP_ENV = "production"
# TODO: update APP_BASE_URL once the production custom domain is confirmed
APP_BASE_URL = "https://example.com"
EMERGENCY_CONTACT_TO = "carry.my.bottle@gmail.com"
EMERGENCY_CONTACT_FROM = "noreply@example.com"

[[env.production.d1_databases]]
binding = "DB"
database_name = "carrymybottle-prod"
# TODO: replace with the production D1 database_id created via Terraform
database_id = "placeholder-replace-with-actual-id"
