name: Deploy (dev)

# Deploys the app to the Cloudflare Workers development environment
# (default env in apps/wrangler.toml -> worker "carrymybottle", D1 "carrymybottle-dev")
# on every push to develop that touches the app, and on manual dispatch.
on:
  push:
    branches:
      - develop
    paths:
      - 'apps/**'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

# Never run two dev deploys at once; queue instead of cancelling a deploy mid-upload.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build (OpenNext for Cloudflare)
        run: pnpm run build:cf

      - name: Deploy to Cloudflare Workers (dev)
        run: pnpm run deploy:cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
